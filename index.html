<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="送給最喜歡的人的生日驚喜互動小網站。">
  <meta name="theme-color" content="#FFB5BA">
  <title>生日驚喜 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <img class="side-image side-image-left" src="assets/images/boboquoka.png" alt="左側裝飾圖">
  <img class="side-image side-image-right" src="assets/images/boobheart.png" alt="右側裝飾圖">

  <div id="app">
    <header class="top-bar">
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="chapter-label" id="chapter-label"></span>
    </header>

    <main class="scene-container" id="scene-container" role="main" aria-live="polite"></main>

    <footer class="bottom-bar" id="bottom-bar">
      <button type="button" class="btn btn-primary hidden" id="btn-continue">繼續</button>
      <button type="button" class="btn btn-secondary hidden" id="btn-skip">直接看完</button>
    </footer>
  </div>

  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <button type="button" class="music-toggle" id="music-toggle" aria-label="切換背景音樂">
    <span class="music-icon">🎵</span>
  </button>
  <p class="music-hint" id="music-hint">如果有聲音會更有驚喜感，點一下右下角可以開關音樂。</p>

  <audio id="bgm" loop preload="none">
    <source src="assets/audio/bgm.m4a" type="audio/mpeg">
  </audio>

  <script type="module" src="js/engine.js"></script>
</body>
</html>
